name: Main Preview candidate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact main commit to rebuild if its candidate is missing
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/build-preview-candidate.yml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      source_kind: direct
  recover-candidate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-preview-candidate.yml
    with:
      source_sha: ${{ inputs.source_sha }}
      source_kind: recovery
