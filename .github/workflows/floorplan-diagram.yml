name: Floor plan diagram

on:
  push:
    branches: [main]
    paths:
      - src/floorPlan.ts
      - scripts/generate-floorplan-diagram.ts
      - package.json
      - package-lock.json
  workflow_dispatch:

jobs:
  render:
    outputs:
      generated_sha: ${{ steps.commit_asset.outputs.commit_hash }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate floor plan diagram
        run: npm run floorplan:diagram
      - name: Commit updated diagram
        id: commit_asset
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: '🤖 : – Update floor plan diagram'
          file_pattern: docs/assets/floorplan.svg README.md

  preview-generated-commit:
    needs: render
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.render.result == 'success' &&
      needs.render.outputs.generated_sha != ''
    permissions:
      contents: read
    uses: ./.github/workflows/build-preview-candidate.yml
    with:
      source_sha: ${{ needs.render.outputs.generated_sha }}
      source_kind: generated
