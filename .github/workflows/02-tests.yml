name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:ci
      - name: Miniature drift guard
        run: npm run miniature:check
      - name: Install Playwright browser for collider audits
        run: npx playwright install --with-deps chromium-headless-shell
      - name: Collider redundancy gate
        run: npm run collider:audit:redundancy
      - name: Immersive performance budget
        run: npm run perf:budget
      - name: Upload controlled performance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-performance-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/controlled-performance/controlled-performance-result-v1.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Smoke test
        run: npm run smoke

  patch-coverage:
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact coverage revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate source coverage
        run: npm run test:ci -- --coverage
      - name: Require LCOV report
        run: test -s coverage/lcov.info
      - name: Check trusted upload configuration
        id: codecov-auth
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          if [[ -n "${CODECOV_TOKEN}" ]]; then
            echo 'configured=true' >> "${GITHUB_OUTPUT}"
          else
            echo '::warning::Codecov upload skipped: CODECOV_TOKEN is not configured.'
          fi
      - name: Upload trusted coverage to Codecov
        if: steps.codecov-auth.outputs.configured == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
      - name: Upload public fork coverage without a token
        if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public' && github.event.pull_request.head.repo.full_name != github.repository
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          override_commit: ${{ github.event.pull_request.head.sha }}
          files: coverage/lcov.info
          disable_search: true
          fail_ci_if_error: true
      - name: Note skipped same-repository Dependabot upload
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'dependabot[bot]'
        run: echo '::notice::Codecov upload skipped for same-repository Dependabot; coverage ran without credentials.'

  immersive-traversal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium-headless-shell
      - name: House, museum, exterior, keyboard, and small-screen traversal
        run: >-
          npm run test:e2e -- playwright/decorative-lighting.spec.ts playwright/immersive-stairs-roundtrip.spec.ts
          playwright/immersive-basement-roundtrip.spec.ts
          playwright/immersive-career-museum.spec.ts
          playwright/immersive-exterior-doors.spec.ts
          playwright/immersive-garage-loop.spec.ts
          playwright/immersive-residential-street.spec.ts
          playwright/immersive-door-proximity.spec.ts
          playwright/immersive-under-stair-passage.spec.ts
          playwright/keyboard-traversal.spec.ts playwright/small-screen-hud.spec.ts
          playwright/avatar-integration.spec.ts playwright/avatar-scale.spec.ts
          playwright/aquiloop.spec.ts playwright/gamepad-controls.spec.ts
          playwright/miniature-property.spec.ts
          --workers=1 --retries=0 --trace=retain-on-failure
      - name: Retain traversal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immersive-traversal-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  docker-runtime-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t danielsmith-io:local .

      - name: Smoke test Docker runtime
        shell: bash
        run: |
          set -euo pipefail

          container_name="danielsmith-io-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "${container_name}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d --name "${container_name}" \
            -p 127.0.0.1:8080:8080 \
            danielsmith-io:local

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null && \
              curl -fsS http://127.0.0.1:8080/healthz >/dev/null && \
              curl -fsS http://127.0.0.1:8080/livez >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "${ready}" = 1

          curl -fsSI http://127.0.0.1:8080/healthz | \
            grep -i 'content-type: application/json'
          curl -fsSI http://127.0.0.1:8080/healthz | \
            grep -i 'cache-control: no-store'
          studio_html="$(curl -fsS http://127.0.0.1:8080/studio)"
          grep -qi '<html' <<< "${studio_html}"

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/definitely-missing.pdf)" = "404"

          test "$(curl -s -o /dev/null -w '%{http_code}' \
            http://127.0.0.1:8080/assets/definitely-missing.js.map)" = "404"

          docker exec "${container_name}" sh -lc '! command -v node'
          docker exec "${container_name}" sh -lc \
            '! find /usr/share/nginx/html -type f -name "*.map" -print -quit | grep .'

          asset="$(
            docker exec "${container_name}" sh -lc \
              "find /usr/share/nginx/html/assets -maxdepth 1 -type f ! -name '*.map' | head -n 1" | \
              sed 's#^/usr/share/nginx/html##'
          )"
          test -n "${asset}"

          curl -fsSI "http://127.0.0.1:8080${asset}" | \
            grep -i 'cache-control: public, max-age=31536000, immutable'

          docker logs "${container_name}"
