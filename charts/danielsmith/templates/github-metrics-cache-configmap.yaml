{{- if .Values.githubMetricsCache.enabled -}}
{{- include "danielsmith.githubMetricsCache.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "danielsmith.fullname" . }}-github-metrics-cache
  labels:
    {{- include "danielsmith.labels" . | nindent 4 }}
data:
  repos.json: |
{{ toPrettyJson .Values.githubMetricsCache.repos | indent 4 }}
  refresh-github-metrics.py: |
    #!/usr/bin/env python3
    """Refresh unauthenticated public GitHub repository metrics into JSON."""

    import datetime as dt
    import json
    import os
    import re
    import sys
    import time
    import urllib.error
    import urllib.request


    API_ROOT = "https://api.github.com/repos"
    SOURCE = "github-api"
    USER_AGENT = "danielsmith.io-github-metrics-cache"
    MAX_REPOS = 100
    MAX_DURATION_MS = 86_400_000
    OWNER_PATTERN = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9-]*[A-Za-z0-9])?$")
    REPO_PATTERN = re.compile(r"^[A-Za-z0-9._-]+$")


    def utc_now():
        return dt.datetime.now(dt.timezone.utc)


    def isoformat(timestamp):
        return timestamp.isoformat(timespec="milliseconds").replace("+00:00", "Z")


    def read_int_env(name, default):
        value = os.environ.get(name, "")
        try:
            parsed = int(value)
        except ValueError:
            return default
        return parsed if parsed > 0 else default


    def load_repos(path):
        with open(path, "r", encoding="utf-8") as handle:
            repos = json.load(handle)
        if not isinstance(repos, list) or not 0 < len(repos) <= MAX_REPOS:
            raise ValueError("repos config must contain between 1 and 100 repositories")
        normalized = []
        seen = set()
        for item in repos:
            if not isinstance(item, dict):
                raise ValueError("each repo config must be an object")
            owner = item.get("owner")
            repo = item.get("repo")
            if not isinstance(owner, str) or not isinstance(repo, str):
                raise ValueError("repo owner and name must be strings")
            if len(owner) > 39 or len(repo) > 100:
                raise ValueError("repo owner or name exceeds its bounded length")
            if not OWNER_PATTERN.fullmatch(owner) or not REPO_PATTERN.fullmatch(repo):
                raise ValueError("repo owner or name contains invalid characters")
            key = f"{owner.lower()}/{repo.lower()}"
            if key in seen:
                raise ValueError("repo config contains a duplicate repository")
            seen.add(key)
            normalized.append({"owner": owner, "repo": repo})
        return normalized


    def fetch_repo(owner, repo, timeout):
        request = urllib.request.Request(
            f"{API_ROOT}/{owner}/{repo}",
            headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": USER_AGENT,
                "X-GitHub-Api-Version": "2022-11-28",
            },
        )
        with urllib.request.urlopen(request, timeout=timeout) as response:
            return json.loads(response.read().decode("utf-8"))


    def failure_category(exc):
        status = getattr(exc, "code", None)
        if status in (403, 429):
            return "rate_limited"
        if isinstance(status, int) and 400 <= status < 500:
            return "client"
        if isinstance(status, int) and status >= 500:
            return "upstream"
        if isinstance(exc, (TimeoutError,)):
            return "timeout"
        return "network"


    def repo_record(owner, repo, fetched_at, data):
        return {
            "owner": owner,
            "repo": repo,
            "stars": data.get("stargazers_count", 0) or 0,
            "subscribers": data.get("subscribers_count", 0) or 0,
            "watchers": data.get("subscribers_count", data.get("watchers_count", 0)) or 0,
            "forks": data.get("forks_count", 0) or 0,
            "openIssues": data.get("open_issues_count", 0) or 0,
            "pushedAt": data.get("pushed_at"),
            "fetchedAt": fetched_at,
            "htmlUrl": data.get("html_url"),
        }


    def read_previous(path):
        try:
            with open(path, "r", encoding="utf-8") as handle:
                value = json.load(handle)
            return value if isinstance(value, dict) else None
        except (FileNotFoundError, OSError, ValueError):
            return None


    def build_payload(repos, timeout, cache_ttl, previous=None, deadline=None):
        started = time.monotonic()
        attempted_at = utc_now()
        fetched_at = isoformat(attempted_at)
        previous_repos = previous.get("repos", {}) if isinstance(previous, dict) else {}
        if not isinstance(previous_repos, dict):
            previous_repos = {}
        output_repos = {}
        errors = {}
        categories = []
        successful = 0
        retained = 0
        for item in repos:
            owner, repo = item["owner"], item["repo"]
            key = f"{owner.lower()}/{repo.lower()}"
            remaining_timeout = timeout
            try:
                if deadline is not None:
                    remaining = deadline - time.monotonic()
                    if remaining <= 0:
                        raise TimeoutError("startup deadline elapsed")
                    remaining_timeout = min(timeout, remaining)
                output_repos[key] = repo_record(
                    owner, repo, fetched_at, fetch_repo(owner, repo, remaining_timeout)
                )
                successful += 1
            except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError, OSError) as exc:
                category = failure_category(exc)
                categories.append(category)
                errors[key] = {"category": category, "attemptedAt": fetched_at}
                retained_record = previous_repos.get(key)
                if isinstance(retained_record, dict) and retained_record.get("fetchedAt"):
                    output_repos[key] = retained_record
                    retained += 1

        failed = len(repos) - successful
        fetched_times = [
            record.get("fetchedAt") for record in output_repos.values()
            if isinstance(record, dict) and isinstance(record.get("fetchedAt"), str)
        ]
        oldest_data_at = min(fetched_times) if fetched_times else None
        previous_telemetry = previous.get("telemetry", {}) if isinstance(previous, dict) else {}
        prior_success = (
            previous_telemetry.get("lastSuccessfulRefreshAt")
            if isinstance(previous_telemetry, dict)
            else None
        )
        last_success = fetched_at if failed == 0 else prior_success
        if failed == 0:
            state, completeness, category = "fresh", "complete", "none"
        elif output_repos:
            state, completeness = "stale", "partial"
            category = "rate_limited" if "rate_limited" in categories else categories[0]
        else:
            state, completeness = "unavailable", "none"
            category = "rate_limited" if "rate_limited" in categories else categories[0]
        duration_ms = min(max(round((time.monotonic() - started) * 1000), 0), MAX_DURATION_MS)
        generated_at = last_success or fetched_at
        try:
            generated = dt.datetime.fromisoformat(generated_at.replace("Z", "+00:00"))
        except (ValueError, AttributeError):
            generated = attempted_at
        return {
            "schemaVersion": 2,
            "generatedAt": generated_at,
            "expiresAt": isoformat(generated + dt.timedelta(seconds=cache_ttl)),
            "source": SOURCE if output_repos else "github-api-unavailable",
            "repos": output_repos,
            "errors": errors,
            "telemetry": {
                "cacheEnabled": True,
                "state": state,
                "completeness": completeness,
                "lastSuccessfulRefreshAt": last_success,
                "lastRefreshAttemptAt": fetched_at,
                "refreshDurationMs": duration_ms,
                "failureCategory": category,
                "configuredRepoCount": len(repos),
                "successfulRepoCount": successful,
                "failedRepoCount": failed,
                "retainedRepoCount": retained,
                "oldestDataAt": oldest_data_at,
            },
        }


    def atomic_write_json(path, payload):
        directory = os.path.dirname(path)
        os.makedirs(directory, exist_ok=True)
        temp_path = f"{path}.tmp.{os.getpid()}"
        with open(temp_path, "w", encoding="utf-8") as handle:
            json.dump(payload, handle, indent=2, sort_keys=True)
            handle.write("\n")
        with open(temp_path, "r", encoding="utf-8") as handle:
            json.load(handle)
        os.replace(temp_path, path)


    def warmup_payload(configured_count):
        return {
            "schemaVersion": 2,
            "generatedAt": isoformat(utc_now()),
            "expiresAt": isoformat(utc_now()),
            "source": "github-api-warmup",
            "repos": {},
            "errors": {},
            "telemetry": {
                "cacheEnabled": True,
                "state": "warmup",
                "completeness": "none",
                "lastSuccessfulRefreshAt": None,
                "lastRefreshAttemptAt": None,
                "refreshDurationMs": 0,
                "failureCategory": "none",
                "configuredRepoCount": configured_count,
                "successfulRepoCount": 0,
                "failedRepoCount": 0,
                "retainedRepoCount": 0,
                "oldestDataAt": None,
            },
        }


    def log(message):
        print(f"[github-metrics] {message}", flush=True)


    def main():
        repos_path = os.environ.get("GITHUB_METRICS_REPOS_PATH", "/etc/github-metrics/repos.json")
        output_path = os.environ.get("GITHUB_METRICS_OUTPUT_PATH", "/cache/github-metrics.json")
        refresh_interval = read_int_env("GITHUB_METRICS_REFRESH_INTERVAL_SECONDS", 3600)
        request_timeout = read_int_env("GITHUB_METRICS_REQUEST_TIMEOUT_SECONDS", 5)
        startup_timeout = read_int_env("GITHUB_METRICS_STARTUP_TIMEOUT_SECONDS", 20)
        cache_ttl = read_int_env("GITHUB_METRICS_CACHE_TTL_SECONDS", 4500)
        repos = load_repos(repos_path)
        previous = read_previous(output_path)
        if not previous or previous.get("source") == "static-neutral-placeholder":
            atomic_write_json(output_path, warmup_payload(len(repos)))
            previous = read_previous(output_path)
        log(f"loaded {len(repos)} public repo targets; writing {output_path}")
        first_refresh = True
        while True:
            started = time.monotonic()
            deadline = started + startup_timeout if first_refresh else None
            try:
                payload = build_payload(repos, request_timeout, cache_ttl, previous, deadline)
            except Exception:
                payload = previous or warmup_payload(len(repos))
                payload["telemetry"]["state"] = "unavailable"
                payload["telemetry"]["failureCategory"] = "internal"
            atomic_write_json(output_path, payload)
            previous = payload
            telemetry = payload["telemetry"]
            log(
                f"refresh state={telemetry['state']} ok={telemetry['successfulRepoCount']} "
                f"failed={telemetry['failedRepoCount']} retained={telemetry['retainedRepoCount']}; "
                f"next={refresh_interval}s"
            )
            first_refresh = False
            elapsed = time.monotonic() - started
            time.sleep(max(refresh_interval - elapsed, 1))

    if __name__ == "__main__":
        try:
            main()
        except KeyboardInterrupt:
            sys.exit(0)

{{- end }}
