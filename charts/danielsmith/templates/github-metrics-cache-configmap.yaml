{{- if .Values.githubMetricsCache.enabled -}}
{{- include "danielsmith.githubMetricsCache.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "danielsmith.fullname" . }}-github-metrics-cache
  labels:
    {{- include "danielsmith.labels" . | nindent 4 }}
data:
  repos.json: |
{{ toPrettyJson .Values.githubMetricsCache.repos | indent 4 }}
  refresh-github-metrics.py: |
    #!/usr/bin/env python3
    """Refresh bounded public GitHub repository metrics into runtime JSON."""

    import datetime as dt
    import json
    import os
    import re
    import sys
    import time
    import urllib.error
    import urllib.request


    API_ROOT = "https://api.github.com/repos"
    SOURCE = "github-api"
    USER_AGENT = "danielsmith.io-github-metrics-cache"
    MAX_REPOS = 50
    MAX_DURATION_MS = 86_400_000
    NAME_PATTERN = re.compile(r"^[A-Za-z0-9_.-]{1,100}$")
    FAILURE_CATEGORIES = (
        "rate_limited", "not_found", "upstream", "timeout", "network",
        "invalid_response", "internal",
    )


    def utc_now():
        return dt.datetime.now(dt.timezone.utc)


    def isoformat(timestamp):
        return timestamp.isoformat(timespec="milliseconds").replace("+00:00", "Z")


    def read_int_env(name, default):
        try:
            parsed = int(os.environ.get(name, ""))
        except ValueError:
            return default
        return parsed if parsed > 0 else default


    def load_repos(path):
        with open(path, "r", encoding="utf-8") as handle:
            repos = json.load(handle)
        if not isinstance(repos, list) or not 1 <= len(repos) <= MAX_REPOS:
            raise ValueError(f"repos config must contain 1..{MAX_REPOS} entries")
        normalized = []
        seen = set()
        for item in repos:
            if not isinstance(item, dict):
                raise ValueError("each repo config entry must be an object")
            owner = item.get("owner")
            repo = item.get("repo")
            if not isinstance(owner, str) or not NAME_PATTERN.fullmatch(owner):
                raise ValueError("repo owner is invalid")
            if not isinstance(repo, str) or not NAME_PATTERN.fullmatch(repo):
                raise ValueError("repo name is invalid")
            key = f"{owner.lower()}/{repo.lower()}"
            if key in seen:
                raise ValueError("repo config contains a duplicate")
            seen.add(key)
            normalized.append({"owner": owner, "repo": repo})
        return normalized


    def fetch_repo(owner, repo, timeout):
        request = urllib.request.Request(
            f"{API_ROOT}/{owner}/{repo}",
            headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": USER_AGENT,
                "X-GitHub-Api-Version": "2022-11-28",
            },
        )
        with urllib.request.urlopen(request, timeout=timeout) as response:
            data = json.loads(response.read().decode("utf-8"))
        if not isinstance(data, dict):
            raise ValueError("invalid upstream response")
        return data


    def failure_category(exc):
        status = getattr(exc, "code", None)
        if status in (403, 429):
            return "rate_limited"
        if status == 404:
            return "not_found"
        if isinstance(status, int):
            return "upstream"
        if isinstance(exc, (TimeoutError,)):
            return "timeout"
        if isinstance(exc, (urllib.error.URLError, OSError)):
            return "network"
        if isinstance(exc, (ValueError, json.JSONDecodeError)):
            return "invalid_response"
        return "internal"


    def bounded_count(value):
        return max(0, min(int(value), MAX_REPOS))


    def repo_record(owner, repo, fetched_at, data):
        def metric(name):
            value = data.get(name, 0)
            return max(0, min(value, 2_147_483_647)) if isinstance(value, int) else 0
        return {
            "owner": owner,
            "repo": repo,
            "stars": metric("stargazers_count"),
            "subscribers": metric("subscribers_count"),
            "watchers": metric("subscribers_count"),
            "forks": metric("forks_count"),
            "openIssues": metric("open_issues_count"),
            "pushedAt": data.get("pushed_at") if isinstance(data.get("pushed_at"), str) else None,
            "fetchedAt": fetched_at,
            "htmlUrl": f"https://github.com/{owner}/{repo}",
        }


    def prior_repos(previous):
        if not isinstance(previous, dict) or not isinstance(previous.get("repos"), dict):
            return {}
        return previous["repos"]


    def build_payload(repos, timeout, cache_ttl, previous=None, deadline=None):
        started_at = utc_now()
        attempt_at = isoformat(started_at)
        old_repos = prior_repos(previous)
        output_repos = {}
        errors = {}
        categories = {category: 0 for category in FAILURE_CATEGORIES}
        successful = 0
        retained = 0
        for item in repos:
            owner, repo = item["owner"], item["repo"]
            key = f"{owner.lower()}/{repo.lower()}"
            remaining_timeout = timeout
            try:
                if deadline is not None:
                    remaining = deadline - time.monotonic()
                    if remaining <= 0:
                        raise TimeoutError("startup deadline")
                    remaining_timeout = min(timeout, remaining)
                data = fetch_repo(owner, repo, remaining_timeout)
                output_repos[key] = repo_record(owner, repo, attempt_at, data)
                successful += 1
            except Exception as exc:
                category = failure_category(exc)
                categories[category] += 1
                errors[key] = {"category": category, "failedAt": attempt_at}
                prior = old_repos.get(key)
                if isinstance(prior, dict):
                    output_repos[key] = prior
                    retained += 1
        failed = len(repos) - successful
        duration_ms = 0
        previous_telemetry = previous.get("telemetry", {}) if isinstance(previous, dict) else {}
        last_success = (
            attempt_at if failed == 0
            else previous_telemetry.get("lastSuccessfulRefreshAt")
        )
        if not isinstance(last_success, str):
            last_success = None
        oldest = min(
            (record.get("fetchedAt") for record in output_repos.values()
             if isinstance(record, dict) and isinstance(record.get("fetchedAt"), str)),
            default=None,
        )
        completeness = "complete" if failed == 0 else ("partial" if output_repos else "none")
        state = "fresh" if failed == 0 else ("stale" if output_repos else "unavailable")
        payload = {
            "schemaVersion": 1,
            "generatedAt": attempt_at,
            "expiresAt": isoformat(started_at + dt.timedelta(seconds=cache_ttl)),
            "source": SOURCE if output_repos else "github-api-unavailable",
            "repos": output_repos,
            "errors": errors,
            "telemetry": {
                "cacheEnabled": True,
                "state": state,
                "lastAttemptAt": attempt_at,
                "lastSuccessfulRefreshAt": last_success,
                "oldestDataAt": oldest,
                "refreshDurationMs": duration_ms,
                "completeness": completeness,
                "configuredRepositoryCount": bounded_count(len(repos)),
                "successfulRepositoryCount": bounded_count(successful),
                "failedRepositoryCount": bounded_count(failed),
                "retainedRepositoryCount": bounded_count(retained),
                "failureCategories": {k: v for k, v in categories.items() if v},
            },
        }
        return payload


    def atomic_write_json(path, payload):
        directory = os.path.dirname(path)
        os.makedirs(directory, exist_ok=True)
        temp_path = f"{path}.tmp.{os.getpid()}"
        with open(temp_path, "w", encoding="utf-8") as handle:
            json.dump(payload, handle, indent=2, sort_keys=True)
            handle.write("\n")
        with open(temp_path, "r", encoding="utf-8") as handle:
            json.load(handle)
        os.replace(temp_path, path)


    def read_previous(path):
        try:
            with open(path, "r", encoding="utf-8") as handle:
                payload = json.load(handle)
            return payload if isinstance(payload, dict) else None
        except (FileNotFoundError, OSError, ValueError):
            return None


    def refresh_once(repos, output_path, timeout, cache_ttl, deadline=None):
        started = time.monotonic()
        previous = read_previous(output_path)
        previous_telemetry = previous.get("telemetry") if isinstance(previous, dict) else None
        if not isinstance(previous_telemetry, dict) or not previous_telemetry.get("cacheEnabled"):
            now = utc_now()
            atomic_write_json(output_path, {
                "schemaVersion": 1,
                "generatedAt": isoformat(now),
                "expiresAt": isoformat(now),
                "source": "github-api-warmup",
                "repos": {},
                "errors": {},
                "telemetry": {
                    "cacheEnabled": True,
                    "state": "warmup",
                    "lastAttemptAt": None,
                    "lastSuccessfulRefreshAt": None,
                    "oldestDataAt": None,
                    "refreshDurationMs": 0,
                    "completeness": "none",
                    "configuredRepositoryCount": bounded_count(len(repos)),
                    "successfulRepositoryCount": 0,
                    "failedRepositoryCount": 0,
                    "retainedRepositoryCount": 0,
                    "failureCategories": {},
                },
            })
        payload = build_payload(repos, timeout, cache_ttl, previous, deadline)
        payload["telemetry"]["refreshDurationMs"] = min(
            max(round((time.monotonic() - started) * 1000), 0), MAX_DURATION_MS
        )
        atomic_write_json(output_path, payload)
        return payload


    def log(message):
        print(f"[github-metrics] {message}", flush=True)


    def main():
        repos_path = os.environ.get("GITHUB_METRICS_REPOS_PATH", "/etc/github-metrics/repos.json")
        output_path = os.environ.get("GITHUB_METRICS_OUTPUT_PATH", "/cache/github-metrics.json")
        refresh_interval = read_int_env("GITHUB_METRICS_REFRESH_INTERVAL_SECONDS", 3600)
        request_timeout = read_int_env("GITHUB_METRICS_REQUEST_TIMEOUT_SECONDS", 5)
        startup_timeout = read_int_env("GITHUB_METRICS_STARTUP_TIMEOUT_SECONDS", 20)
        cache_ttl = read_int_env("GITHUB_METRICS_CACHE_TTL_SECONDS", 4500)
        repos = load_repos(repos_path)
        log(f"loaded {len(repos)} public repo targets")
        first_refresh = True
        while True:
            started = time.monotonic()
            deadline = started + startup_timeout if first_refresh else None
            try:
                payload = refresh_once(repos, output_path, request_timeout, cache_ttl, deadline)
                telemetry = payload["telemetry"]
                log(
                    f"refresh state={telemetry['state']} "
                    f"ok={telemetry['successfulRepositoryCount']} "
                    f"failed={telemetry['failedRepositoryCount']} "
                    f"retained={telemetry['retainedRepositoryCount']}"
                )
            except Exception as exc:
                log(f"refresh internal failure category={failure_category(exc)}")
            first_refresh = False
            time.sleep(max(refresh_interval - (time.monotonic() - started), 1))


    if __name__ == "__main__":
        try:
            main()
        except KeyboardInterrupt:
            sys.exit(0)

{{- end }}
