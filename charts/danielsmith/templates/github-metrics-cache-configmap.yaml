{{- if .Values.githubMetricsCache.enabled -}}
{{- include "danielsmith.githubMetricsCache.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "danielsmith.fullname" . }}-github-metrics-cache
  labels:
    {{- include "danielsmith.labels" . | nindent 4 }}
data:
  repos.json: |
{{ toPrettyJson .Values.githubMetricsCache.repos | indent 4 }}
  refresh-github-metrics.py: |
    #!/usr/bin/env python3
    """Publish bounded GitHub cache data and refresh telemetry as static JSON."""

    import datetime as dt
    import json
    import math
    import os
    import re
    import sys
    import time
    import urllib.error
    import urllib.request

    API_ROOT = "https://api.github.com/repos"
    SOURCE = "github-api"
    USER_AGENT = "danielsmith.io-github-metrics-cache"
    MAX_REPOS = 50
    MAX_INPUT_BYTES = 262_144
    MAX_OUTPUT_BYTES = 262_144
    MAX_METRIC = 2_147_483_647
    MAX_AGE_SECONDS = 31_536_000
    MAX_DURATION_MS = 3_600_000
    NAME_PATTERN = re.compile(r"^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,98}[A-Za-z0-9])?$")
    FAILURE_CATEGORIES = {
        "configuration", "internal", "invalid_response", "network", "not_found",
        "rate_limited", "timeout", "upstream",
    }
    METRIC_FIELDS = {
        "stars": "stargazers_count", "subscribers": "subscribers_count",
        "watchers": "watchers_count", "forks": "forks_count",
        "openIssues": "open_issues_count",
    }


    def utc_now():
        return dt.datetime.now(dt.timezone.utc)


    def isoformat(timestamp):
        return timestamp.astimezone(dt.timezone.utc).isoformat(
            timespec="milliseconds"
        ).replace("+00:00", "Z")


    def parse_timestamp(value):
        if not isinstance(value, str) or len(value) > 40:
            return None
        try:
            parsed = dt.datetime.fromisoformat(value.replace("Z", "+00:00"))
        except ValueError:
            return None
        if parsed.tzinfo is None:
            return None
        return parsed.astimezone(dt.timezone.utc)


    def read_int_env(name, default):
        try:
            parsed = int(os.environ.get(name, ""))
        except ValueError:
            return default
        return parsed if parsed > 0 else default


    def load_json_bounded(path):
        if os.path.getsize(path) > MAX_INPUT_BYTES:
            raise ValueError("JSON input exceeds byte limit")
        with open(path, "rb") as handle:
            raw = handle.read(MAX_INPUT_BYTES + 1)
        if len(raw) > MAX_INPUT_BYTES:
            raise ValueError("JSON input exceeds byte limit")
        return json.loads(raw.decode("utf-8"))


    def load_repos(path):
        repos = load_json_bounded(path)
        if not isinstance(repos, list) or not 1 <= len(repos) <= MAX_REPOS:
            raise ValueError(f"repos config must contain 1-{MAX_REPOS} repositories")
        normalized = []
        seen = set()
        for item in repos:
            if not isinstance(item, dict):
                raise ValueError("each repository must be an object")
            owner, repo = item.get("owner"), item.get("repo")
            if not isinstance(owner, str) or not isinstance(repo, str):
                raise ValueError("repository owner and repo must be strings")
            if not NAME_PATTERN.fullmatch(owner) or not NAME_PATTERN.fullmatch(repo):
                raise ValueError("repository owner or repo is invalid")
            key = f"{owner.lower()}/{repo.lower()}"
            if key in seen:
                raise ValueError("repository configuration contains a duplicate")
            seen.add(key)
            normalized.append({"owner": owner, "repo": repo})
        return normalized


    def fetch_repo(owner, repo, timeout):
        request = urllib.request.Request(
            f"{API_ROOT}/{owner}/{repo}",
            headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": USER_AGENT,
                "X-GitHub-Api-Version": "2022-11-28",
            },
        )
        with urllib.request.urlopen(request, timeout=timeout) as response:
            body = response.read(MAX_INPUT_BYTES + 1)
        if len(body) > MAX_INPUT_BYTES:
            raise ValueError("GitHub response exceeds byte limit")
        return json.loads(body.decode("utf-8"))


    def failure_category(exc):
        status = getattr(exc, "code", None)
        if status in (403, 429):
            return "rate_limited"
        if status == 404:
            return "not_found"
        if isinstance(status, int):
            return "upstream"
        if isinstance(exc, TimeoutError):
            return "timeout"
        if isinstance(exc, urllib.error.URLError):
            return "timeout" if isinstance(exc.reason, TimeoutError) else "network"
        if isinstance(exc, (json.JSONDecodeError, UnicodeDecodeError, ValueError, TypeError)):
            return "invalid_response"
        if isinstance(exc, OSError):
            return "network"
        return "internal"


    def bounded_count(value):
        return max(0, min(int(value), MAX_REPOS))


    def metric(value):
        if isinstance(value, bool) or not isinstance(value, (int, float)):
            raise ValueError("repository metric must be numeric")
        if not math.isfinite(value) or value < 0:
            raise ValueError("repository metric must be finite and non-negative")
        return min(int(value), MAX_METRIC)


    def repo_record(owner, repo, fetched_at, data):
        if not isinstance(data, dict):
            raise ValueError("GitHub response must be an object")
        required = set(METRIC_FIELDS.values()) | {"pushed_at", "html_url"}
        if not required.issubset(data):
            raise ValueError("GitHub response is missing required fields")
        pushed_at = parse_timestamp(data["pushed_at"])
        expected_url = f"https://github.com/{owner}/{repo}"
        if (
            pushed_at is None
            or not isinstance(data["html_url"], str)
            or data["html_url"].casefold() != expected_url.casefold()
        ):
            raise ValueError("GitHub response contains invalid identity fields")
        values = {name: metric(data[field]) for name, field in METRIC_FIELDS.items()}
        # Preserve the legacy UI contract: watchers means subscribers when available.
        values["watchers"] = metric(
            data.get("subscribers_count", data["watchers_count"])
        )
        return {
            "owner": owner,
            "repo": repo,
            **values,
            "pushedAt": isoformat(pushed_at),
            "fetchedAt": fetched_at,
            "htmlUrl": expected_url,
        }


    def retained_record(key, configured, value):
        if not isinstance(value, dict):
            return None
        owner, repo = configured[key]
        retained_owner, retained_repo = value.get("owner"), value.get("repo")
        if (
            not isinstance(retained_owner, str)
            or not isinstance(retained_repo, str)
            or retained_owner.casefold() != owner.casefold()
            or retained_repo.casefold() != repo.casefold()
        ):
            return None
        fetched_at = parse_timestamp(value.get("fetchedAt"))
        pushed_at = parse_timestamp(value.get("pushedAt"))
        if fetched_at is None or pushed_at is None:
            return None
        try:
            values = {name: metric(value.get(name)) for name in METRIC_FIELDS}
        except (TypeError, ValueError):
            return None
        return {
            "owner": owner,
            "repo": repo,
            **values,
            "pushedAt": isoformat(pushed_at),
            "fetchedAt": isoformat(fetched_at),
            "htmlUrl": f"https://github.com/{owner}/{repo}",
        }


    def load_previous(path, configured):
        try:
            payload = load_json_bounded(path)
        except (OSError, UnicodeDecodeError, json.JSONDecodeError, ValueError):
            return {}, None
        if not isinstance(payload, dict) or payload.get("schemaVersion") != 1:
            return {}, None
        repos = payload.get("repos")
        if not isinstance(repos, dict) or len(repos) > MAX_REPOS:
            return {}, None
        retained = {}
        for key, value in repos.items():
            if not isinstance(key, str):
                continue
            normalized_key = key.casefold()
            if normalized_key not in configured:
                continue
            record = retained_record(normalized_key, configured, value)
            if record is not None:
                retained[normalized_key] = record
        cache = payload.get("cache") if isinstance(payload.get("cache"), dict) else {}
        last_success = cache.get("lastSuccessfulRefreshAt")
        parsed_success = parse_timestamp(last_success)
        return retained, isoformat(parsed_success) if parsed_success else None


    def make_payload(repos, cache_ttl, now, duration_ms, categories, counts, last_success):
        timestamps = [parse_timestamp(item["fetchedAt"]) for item in repos.values()]
        oldest = min(timestamps) if timestamps else None
        complete = counts["failed"] == 0 and counts["successful"] == counts["configured"]
        state = "fresh" if complete else ("stale" if repos else "unavailable")
        completeness = "complete" if complete else ("partial" if repos else "none")
        age = max(0, int((now - oldest).total_seconds())) if oldest else None
        # Envelope freshness follows the oldest record; failures must not renew retained data.
        generated_at = oldest if oldest else now
        return {
            "schemaVersion": 1,
            "generatedAt": isoformat(generated_at),
            "expiresAt": isoformat(generated_at + dt.timedelta(seconds=cache_ttl)),
            "source": SOURCE if repos else "github-api-unavailable",
            "repos": dict(sorted(repos.items())),
            "errors": {},
            "cache": {
                "enabled": True,
                "state": state,
                "lastSuccessfulRefreshAt": last_success,
                "dataCompleteness": completeness,
                "refreshDurationMs": max(0, min(int(duration_ms), MAX_DURATION_MS)),
                "failureCategories": sorted(set(categories).intersection(FAILURE_CATEGORIES)),
                "configuredRepositoryCount": bounded_count(counts["configured"]),
                "successfulRepositoryCount": bounded_count(counts["successful"]),
                "failedRepositoryCount": bounded_count(counts["failed"]),
                "retainedRepositoryCount": bounded_count(counts["retained"]),
                "oldestDataFetchedAt": isoformat(oldest) if oldest else None,
                "retainedDataAgeSeconds": min(age, MAX_AGE_SECONDS) if age is not None else None,
            },
        }


    def atomic_write_json(path, payload):
        encoded = (json.dumps(payload, indent=2, sort_keys=True) + "\n").encode("utf-8")
        if len(encoded) > MAX_OUTPUT_BYTES:
            raise ValueError("published JSON exceeds byte limit")
        directory = os.path.dirname(path)
        os.makedirs(directory, exist_ok=True)
        temp_path = f"{path}.tmp.{os.getpid()}"
        try:
            with open(temp_path, "wb") as handle:
                handle.write(encoded)
                handle.flush()
                os.fsync(handle.fileno())
            os.replace(temp_path, path)
        finally:
            try:
                os.unlink(temp_path)
            except FileNotFoundError:
                pass


    def warming_payload(configured_count):
        return {
            "schemaVersion": 1, "generatedAt": None, "expiresAt": None,
            "source": "github-api-warming", "repos": {}, "errors": {},
            "cache": {
                "enabled": True, "state": "warming", "lastSuccessfulRefreshAt": None,
                "dataCompleteness": "none", "refreshDurationMs": None,
                "failureCategories": [],
                "configuredRepositoryCount": bounded_count(configured_count),
                "successfulRepositoryCount": 0, "failedRepositoryCount": 0,
                "retainedRepositoryCount": 0, "oldestDataFetchedAt": None,
                "retainedDataAgeSeconds": None,
            },
        }


    def refresh_once(repos, output_path, timeout, cache_ttl, deadline=None, fetcher=fetch_repo):
        started = time.monotonic()
        now = utc_now()
        fetched_at = isoformat(now)
        configured = {
            f"{item['owner'].lower()}/{item['repo'].lower()}": (item["owner"], item["repo"])
            for item in repos
        }
        previous, previous_success = load_previous(output_path, configured)
        current = dict(previous)
        successful = failed = retained = 0
        categories = []
        for item in repos:
            owner, repo = item["owner"], item["repo"]
            key = f"{owner.lower()}/{repo.lower()}"
            remaining_timeout = timeout
            if deadline is not None:
                remaining = deadline - time.monotonic()
                if remaining <= 0:
                    failed += 1
                    retained += int(key in previous)
                    categories.append("timeout")
                    continue
                remaining_timeout = min(timeout, remaining)
            try:
                current[key] = repo_record(
                    owner, repo, fetched_at, fetcher(owner, repo, remaining_timeout)
                )
                successful += 1
            except Exception as exc:
                failed += 1
                retained += int(key in previous)
                categories.append(failure_category(exc))
        complete = failed == 0 and successful == len(repos)
        last_success = fetched_at if complete else previous_success
        counts = {
            "configured": len(repos), "successful": successful,
            "failed": failed, "retained": retained,
        }
        payload = make_payload(
            current, cache_ttl, now, (time.monotonic() - started) * 1000,
            categories, counts, last_success,
        )
        atomic_write_json(output_path, payload)
        return payload


    def log(message):
        print(f"[github-metrics] {message}", flush=True)


    def main():
        repos_path = os.environ.get(
            "GITHUB_METRICS_REPOS_PATH", "/etc/github-metrics/repos.json"
        )
        output_path = os.environ.get(
            "GITHUB_METRICS_OUTPUT_PATH", "/cache/github-metrics.json"
        )
        refresh_interval = read_int_env("GITHUB_METRICS_REFRESH_INTERVAL_SECONDS", 3600)
        request_timeout = read_int_env("GITHUB_METRICS_REQUEST_TIMEOUT_SECONDS", 5)
        startup_timeout = read_int_env("GITHUB_METRICS_STARTUP_TIMEOUT_SECONDS", 20)
        cache_ttl = read_int_env("GITHUB_METRICS_CACHE_TTL_SECONDS", 4500)
        repos = load_repos(repos_path)
        configured = {
            f"{item['owner'].lower()}/{item['repo'].lower()}": (item["owner"], item["repo"])
            for item in repos
        }
        retained, _last_success = load_previous(output_path, configured)
        if not retained:
            atomic_write_json(output_path, warming_payload(len(repos)))
        first_refresh = True
        while True:
            started = time.monotonic()
            deadline = started + startup_timeout if first_refresh else None
            payload = refresh_once(repos, output_path, request_timeout, cache_ttl, deadline)
            cache = payload["cache"]
            log(
                f"refresh state={cache['state']} ok={cache['successfulRepositoryCount']} "
                f"failed={cache['failedRepositoryCount']} "
                f"retained={cache['retainedRepositoryCount']}"
            )
            first_refresh = False
            time.sleep(max(refresh_interval - (time.monotonic() - started), 1))


    if __name__ == "__main__":
        try:
            main()
        except (KeyboardInterrupt, ValueError) as exc:
            log(f"stopped: {type(exc).__name__}")
            sys.exit(0 if isinstance(exc, KeyboardInterrupt) else 1)

{{- end }}
